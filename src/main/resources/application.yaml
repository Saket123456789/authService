spring:
  application:
    name: auth-service

  spring:
    datasource:
      url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
      username: ${PGUSER}
      password: ${PGPASSWORD}

    jpa:
      hibernate:
        ddl-auto: update

      show-sql: true

    show-sql: true

    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8085
  servlet:
    context-path: /api